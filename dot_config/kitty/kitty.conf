# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/ayu.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 16
bold_font auto
italic_font auto
bold_italic_font auto

confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# background_opacity 0.59
# dynamic_background_opacity yes
# background_blur 32

# ============================================================
# Kitty Tab Styling — Ayu
# ============================================================

tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes

tab_bar_edge top
tab_bar_align center
tab_bar_style separator
tab_separator "  │  "

tab_bar_margin_width 10
tab_bar_margin_height 6 4

tab_title_max_length 28
tab_title_template "  {index}  {title}  "
active_tab_title_template "  {index}  {title}  "

tab_activity_symbol "●"

# Match Ayu background
tab_bar_background #0e1419
tab_bar_margin_color #0e1419

# Active tab
active_tab_foreground #0e1419
active_tab_background #f19618
active_tab_font_style bold

# Inactive tabs
inactive_tab_foreground #e5e1cf
inactive_tab_background #243340
inactive_tab_font_style normal
